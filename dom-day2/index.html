<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-listners</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: gilroy;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        #main{
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222;
        }
        input{
            display: none;
        }
        #btn{
            padding: 12px 22px;
            background-color: #5ce0bd;
            color: white;
            font-weight: 600;
            border-radius: 5px;
        }
        #main #btn:hover{
            background-color: rgb(39, 144, 83);
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="file-inp"  type="file">
        <div id="btn">
            upload file
        </div>
    </div>
    
</body>
</html>
